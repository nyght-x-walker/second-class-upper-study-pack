name: Deploy study pack

on:
  push:
    branches: [main]
    paths:
      - "study_pack/dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Prepare site
        run: |
          mkdir -p _site
          cp study_pack/dist/Study_Pack.html _site/index.html
          cp study_pack/dist/Study_Pack.html _site/Study_Pack.html
          cp study_pack/dist/Study_Pack_Print.html _site/print.html
          cp study_pack/dist/Study_Pack_Timetable.html _site/timetable.html
          cp study_pack/dist/*.pdf _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
